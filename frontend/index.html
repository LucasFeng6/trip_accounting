<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>出游记账小工具</title>
  <style>
    .hidden { display: none; }
    .section { border: 1px solid #ddd; margin: 10px 0; padding: 10px; }
    .btn-group button { margin-right: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
  </style>
</head>
<body>
  <h1>出游记账工具</h1>

  <!-- Step 1: 用户选择/创建 -->
  <section id="user-section" class="section">
    <h2>1. 选择/创建用户</h2>

    <div class="flex-row">
      <label for="user-select">现有用户：</label>
      <select id="user-select">
        <!-- JS 填充 -->
      </select>
      <button id="btn-refresh-users">刷新用户列表</button>
    </div>

    <div class="flex-row">
      <label for="new-user-name">创建新用户：</label>
      <input type="text" id="new-user-name" placeholder="输入用户名" />
      <button id="btn-create-user">创建用户</button>
    </div>
  </section>

  <!-- Step 2: 选择/新建项目（项目=project_name 字符串） -->
  <section id="project-section" class="section hidden">
    <h2>2. 选择/新建项目</h2>

    <p>
      当前用户：
      <strong id="current-user-name">（未选择）</strong>
    </p>

    <div class="flex-row">
      <label for="project-select">项目列表：</label>
      <select id="project-select">
        <!-- JS 填充：/expenses/projects -->
      </select>
      <button id="btn-refresh-projects">刷新项目列表</button>
    </div>

    <div class="flex-row">
      <label for="new-project-name">新建项目：</label>
      <input type="text" id="new-project-name" placeholder="如：2025 国庆出游" />
      <button id="btn-use-project-name">使用该项目名</button>
      <span class="note">（不需要单独在后端建表，直接以项目名分组记账）</span>
    </div>
  </section>

  <!-- Step 3: 账目操作 -->
  <section id="operations-section" class="section hidden">
    <h2>3. 管理账目</h2>

    <p>
      当前用户：
      <strong id="op-current-user">（未选择）</strong> |
      当前项目：
      <strong id="op-current-project">（未选择）</strong>
    </p>

    <div class="btn-group">
      <button id="btn-show-add-expense">新增账目</button>
      <button id="btn-show-expenses">查看账目</button>
      <button id="btn-delete-expense">删除账目</button>
      <button id="btn-settle">结算</button>
    </div>

    <!-- 新建账目 -->
    <div id="add-expense-panel" class="hidden" style="margin-top: 10px;">
      <h3>新增账目</h3>

      <div class="flex-row">
        <label for="expense-title">账目名：</label>
        <input type="text" id="expense-title" placeholder="如：晚饭、打车" />
      </div>

      <div class="flex-row">
        <label for="expense-payer-select">付款人：</label>
        <select id="expense-payer-select">
          <!-- JS 用所有 users 填充，value=id -->
        </select>
      </div>

      <div class="flex-row">
        <label for="expense-participants-select">参与用户：</label>
        <select id="expense-participants-select" multiple size="5">
          <!-- JS 用所有 users 填充，value=id -->
        </select>
        <span class="note">按 Ctrl/Shift 多选参与该项消费的所有人</span>
      </div>

      <div class="flex-row">
        <label for="expense-amount">金额：</label>
        <input type="number" step="0.01" id="expense-amount" placeholder="如：128.50" />
      </div>

      <div class="flex-row">
        <label for="expense-date">日期：</label>
        <input type="date" id="expense-date" />
        <span class="note">不填则后端默认今天</span>
      </div>

      <button id="btn-submit-expense">保存账目</button>
    </div>

    <!-- 查看账目 -->
    <div id="expenses-list-panel" class="hidden" style="margin-top: 10px;">
      <h3>账目列表</h3>
      <table>
        <thead>
          <tr>
            <th>编号</th>
            <th>日期</th>
            <th>账目名</th>
            <th>付款人</th>
            <th>金额</th>
            <th>参与者</th>
          </tr>
        </thead>
        <tbody id="expenses-tbody">
          <!-- JS 填充 -->
        </tbody>
      </table>
    </div>

    <!-- 删除账目 -->
    <div id="delete-expense-panel" class="hidden" style="margin-top: 10px;">
      <h3>删除账目</h3>
      <p class="note">如账目未显示，请先点击“查看账目”按钮刷新列表。</p>
      <div class="flex-row">
        <label for="delete-expense-id">账目编号：</label>
        <input type="number" id="delete-expense-id" placeholder="输入要删除的账目 ID" />
        <button id="btn-confirm-delete">删除</button>
      </div>
    </div>

    <!-- 结算结果 -->
    <div id="settlement-panel" class="hidden" style="margin-top: 10px;">
      <h3>结算结果</h3>
      <div id="settlement-summary"></div>
      <div id="settlement-transfers" style="margin-top: 8px;"></div>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
