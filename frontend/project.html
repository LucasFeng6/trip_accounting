<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出游记账 - 选择项目</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body>
  <div id="root" class="min-h-screen flex items-center justify-center p-4 bg-gray-50"></div>

  <script type="text/babel" src="main.js"></script>
  <script type="text/babel">
    const Page = () => {
      // 检查是否选了用户
      const userJson = sessionStorage.getItem('user');
      if (!userJson) {
        window.location.href = 'index.html';
        return null;
      }
      const currentUser = JSON.parse(userJson);

      const handleProjectSelected = (projectName, participants = []) => {
        sessionStorage.setItem('projectName', projectName);
        // 如果新建项目时选了人，存起来传给 Dashboard
        sessionStorage.setItem('initialParticipants', JSON.stringify(participants));
        window.location.href = 'dashboard.html';
      };

      const handleBack = () => {
        sessionStorage.removeItem('user');
        window.location.href = 'index.html';
      };
      
      return <ProjectSelection currentUser={currentUser} onProjectSelected={handleProjectSelected} onBack={handleBack} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Page />);
  </script>
</body>
</html>
